name: Actualizar animación de contribuciones

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-serpiente:
    runs-on: ubuntu-latest
    steps:
      - name: Generar animación de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Anggelie
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#C084FC&color_dots=#161B22,#6D28D9,#9333EA,#C084FC,#FDA4D4

      - name: Publicar archivo SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
